<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Offline | Lombok-Japan Family</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem
          max(1.5rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse 70% 45% at 50% -10%, rgba(220, 38, 38, 0.18), transparent 55%),
          #111827;
        color: #f9fafb;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: min(100%, 28rem);
        padding: 2rem 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        object-fit: cover;
        border: 1px solid rgba(245, 158, 11, 0.35);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.6;
        color: #9ca3af;
        font-size: 0.95rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 999px;
        background: #dc2626;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
      a:focus-visible {
        outline: 2px solid #f59e0b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/pwa-192.png" alt="Lombok-Japan Family" width="72" height="72" />
      <h1>オフラインです</h1>
      <p>ネットワーク接続を確認して、再度お試しください。ホーム画面から起動した場合も、接続後に再読み込みできます。</p>
      <a href="/">ホームへ戻る</a>
    </div>
  </body>
</html>
