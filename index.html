<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A2342" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LJF" />
    <!-- Fallback SEO tags for crawlers that don't execute JS. SiteSeo.tsx
         renders the correct per-page versions of every data-seo-fallback
         tag below and removes these on mount (react-helmet-async only
         manages tags it renders itself, so without this cleanup these
         would sit alongside — not replace — the per-page ones, and the
         static homepage values would win the canonical/OGP tags on every
         other page). See SiteSeo.tsx's fallback-cleanup effect. -->
    <meta
      name="description"
      content="日本とインドネシアの国際ファミリーの日常、文化交流、旅行、グルメ情報を発信。"
      data-seo-fallback="true"
    />
    <meta
      name="keywords"
      content="Lombok, Japan, Indonesia, 国際結婚, 国際家族, ロンボク島, 日本生活, インドネシア生活, YouTube"
      data-seo-fallback="true"
    />
    <link
      rel="canonical"
      href="https://lombokjapanfamily.site/"
      data-seo-fallback="true"
    />
    <meta property="og:site_name" content="Lombok-Japan Family" />
    <meta property="og:locale" content="ja_JP" data-seo-fallback="true" />
    <meta property="og:type" content="website" data-seo-fallback="true" />
    <meta
      property="og:title"
      content="Lombok-Japan Family | 日本とインドネシアをつなぐファミリーサイト"
      data-seo-fallback="true"
    />
    <meta
      property="og:description"
      content="日本とインドネシアの国際ファミリーの日常、文化交流、旅行、グルメ情報を発信。"
      data-seo-fallback="true"
    />
    <meta
      property="og:url"
      content="https://lombokjapanfamily.site/"
      data-seo-fallback="true"
    />
    <meta
      property="og:image"
      content="https://lombokjapanfamily.site/images/site/og_lfj.png"
      data-seo-fallback="true"
    />
    <meta property="og:image:width" content="1200" data-seo-fallback="true" />
    <meta property="og:image:height" content="630" data-seo-fallback="true" />
    <meta property="og:image:type" content="image/png" data-seo-fallback="true" />
    <meta name="twitter:card" content="summary_large_image" data-seo-fallback="true" />
    <meta
      name="twitter:title"
      content="Lombok-Japan Family | 日本とインドネシアをつなぐファミリーサイト"
      data-seo-fallback="true"
    />
    <meta
      name="twitter:description"
      content="日本とインドネシアの国際ファミリーの日常、文化交流、旅行、グルメ情報を発信。"
      data-seo-fallback="true"
    />
    <meta
      name="twitter:image"
      content="https://lombokjapanfamily.site/images/site/og_lfj.png"
      data-seo-fallback="true"
    />
    <!-- LCP: home hero brand wallpaper (CSS background; discover early) -->
    <link
      rel="preload"
      as="image"
      href="/images/site/top-wallpaper.jpg"
      type="image/jpeg"
    />
    <link
      rel="apple-touch-startup-image"
      href="/pwa-512.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <title data-seo-fallback="true">
      Lombok-Japan Family | 日本とインドネシアをつなぐファミリーサイト
    </title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
